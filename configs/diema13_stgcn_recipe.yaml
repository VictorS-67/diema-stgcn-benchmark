# STGCN on all thirteen DIEMA labels: the seven emotions, neutral, and five
# more. Identical to configs/diema7_stgcn_recipe.yaml except for the dataset,
# the class count and the label map -- nothing is re-tuned for the harder task,
# which is the point. See RESULTS.md.
#
# Note that `neutral` has roughly a third of the clips of every other label, so
# read balanced accuracy (the mean of the per-class recalls) beside plain
# accuracy.
#
# Requires a dataset built with --emo2idx configs/emo_to_idx.txt and
# --include-positions --position-space joint; see README.md.
#
# Usage:
#   CONFIG=configs/diema13_stgcn_recipe.yaml scripts/run_lpo.sh

data:
  data_path: data/processed/diema13_quat_pos.npz
  split_path: null              # rotating-val leave-performer-out via --fold/--num-folds
  target_repr: 6d
  streams: [root_pos, joint_rot, joint_pos, joint_vel, joint_acc]
  scale_normalize: false
  num_workers: 6

model:
  type: stgcn
  num_class: 13
  in_channels: 15
  dropout: 0.5
  edge_weighting: importance
  # The ORIGINAL ST-GCN temporal block: one 9-frame convolution per block.
  # Every number in the campaign was produced with this setting; the STGCN++
  # multi-branch block (plusplus: true) was never run and is its own campaign.
  # The loader defaults to true, so this line is load-bearing.
  plusplus: false
  # Width of the first four blocks; the ladder is 64/128/256. Swept in the
  # Scales the whole network from one key: 32 gives ~0.8 M parameters,
  # 64 gives 3.1 M, 128 gives 12 M.
  base_channels: 64

skeleton:
  num_nodes: 25
  inward_edges:
    - [0, 1]
    - [2, 1]
    - [3, 2]
    - [4, 3]
    - [5, 4]
    - [6, 5]
    - [7, 6]
    - [8, 7]
    - [9, 5]
    - [10, 9]
    - [11, 10]
    - [12, 11]
    - [13, 5]
    - [14, 13]
    - [15, 14]
    - [16, 15]
    - [17, 1]
    - [18, 17]
    - [19, 18]
    - [20, 19]
    - [21, 1]
    - [22, 21]
    - [23, 22]
    - [24, 23]
  up_axis: "+z"
  lateral_axis: "+x"
  root_order: "ZYX"
  lr_joint_pairs:
    - [12, 8]   # LeftShoulder <-> RightShoulder
    - [13, 9]   # LeftArm <-> RightArm
    - [14, 10]  # LeftForeArm <-> RightForeArm
    - [15, 11]  # LeftHand <-> RightHand
    - [20, 16]  # LeftUpLeg <-> RightUpLeg
    - [21, 17]  # LeftLeg <-> RightLeg
    - [22, 18]  # LeftFoot <-> RightFoot
    - [23, 19]  # LeftToeBase <-> RightToeBase
  rot_channels: "ZYX"

training:
  base_lr: 0.1
  optimizer: SGD
  scheduler_type: cosine
  weight_decay: 0.0005
  max_epochs: 400
  batch_size: 64
  clip_length: 100
  precision: bf16-mixed
  gradient_clip_val: 1.0
  early_stopping: false
  label_smoothing: 0.0
  aux_loss_weights: {}

checkpointing:
  save: [last]
  test_with: last

logging:
  log_dir: logs/stgcn13_recipe/seed{seed}/fold{fold}/

augmentation:
  enabled: true
  rotate: false
  mirror: true
  mirror_prob: 0.5
  speed: false
  noise_sigma: 0
  dropout: false
